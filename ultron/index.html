<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ultron</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%}
.h{position:fixed;left:0;right:0;text-align:center;letter-spacing:.6em;font-weight:300;pointer-events:none;color:#ff5a4a}
#t{top:5vh;font-size:clamp(14px,2.2vw,22px);opacity:.75}
#s{bottom:14vh;font-size:11px;opacity:.5}
form{position:fixed;bottom:4vh;left:50%;transform:translateX(-50%);width:min(520px,calc(100% - 32px));display:flex;gap:8px;opacity:.3;transition:opacity .3s}
form:hover,form:focus-within{opacity:1}
input{flex:1;min-width:0;background:#0a0000;border:1px solid #401010;border-radius:20px;padding:10px 16px;color:#fcc;outline:none;font-size:14px}
button{background:none;border:1px solid #401010;border-radius:20px;color:#f66;padding:0 14px;cursor:pointer}
</style></head><body>
<canvas id="c"></canvas><div id="t" class="h">ULTRON</div><div id="s" class="h">ÇEVRİMİÇİ</div>
<form id="f"><input id="i" placeholder="Ultron'a söylet..." autocomplete="off"><button type="button" id="m">MİK</button><button>▶</button></form>
<script>
const c=document.getElementById('c'),x=c.getContext('2d'),S=document.getElementById('s');
let W,H,D,R,lt=0,lvl=0,tgt=0,pulse=0,spk=0,an=null,fb,tb,ext=0,extT=-1e9,st='';
function rs(){D=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*D;H=c.height=innerHeight*D;R=Math.min(W,H)*.16}
addEventListener('resize',rs);rs();
// tek seferlik duman sprite'ı (her karede gradient yok)
const sp=document.createElement('canvas');sp.width=sp.height=128;
{const g=sp.getContext('2d'),r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba(255,60,55,.5)');r.addColorStop(1,'rgba(255,30,30,0)');g.fillStyle=r;g.fillRect(0,0,128,128)}
const N=56,rnd=Math.random,TAU=Math.PI*2;
const rays=[...Array(N)].map((_,i)=>({a:i/N*TAU+(rnd()-.5)*.09,l:.55+rnd()*.9,p:rnd()*TAU,v:0}));
const puffs=[...Array(64)].map(()=>({a:rnd()*TAU,r:.8+rnd()*.5,s:.3+rnd()*.6,p:rnd()*TAU,z:.5+rnd()*.8}));

function frame(now){
  const t=now/1000,dt=Math.min(.05,t-lt||.016);lt=t;
  // ses seviyesi kaynağı: harici > analizör > TTS
  if(now-extT<300)tgt=ext;
  else if(an){an.getByteTimeDomainData(tb);an.getByteFrequencyData(fb);let s=0;for(const v of tb){const d=(v-128)/128;s+=d*d}tgt=Math.min(1,Math.sqrt(s/tb.length)*5);if(tgt<.03)tgt=0}
  else if(spk){pulse*=Math.pow(.02,dt);tgt=.25+.3*(.5+.5*Math.sin(t*13))*(.5+.5*Math.sin(t*4.3))+.45*pulse}
  else tgt=0;
  // hızlı yükseliş, yumuşak sönüm → titreme yok
  lvl+=(tgt-lvl)*(1-Math.pow(tgt>lvl?1e-5:.12,dt));if(lvl<.002)lvl=0;
  const ns=lvl>.04?'KONUŞUYOR':'ÇEVRİMİÇİ';if(ns!==st)S.textContent=st=ns;

  const cx=W/2,cy=H/2,b=1+.02*Math.sin(t*1.2)+lvl*.08;
  x.globalCompositeOperation='source-over';x.globalAlpha=1;x.fillStyle='#000';x.fillRect(0,0,W,H);
  // ince HUD halkası
  x.strokeStyle='#ff3c32';x.lineWidth=D;x.globalAlpha=.07+lvl*.12;x.setLineDash([2*D,14*D]);x.lineDashOffset=-t*8*D;
  x.beginPath();x.arc(cx,cy,R*2.7,0,TAU);x.stroke();x.setLineDash([]);

  x.globalCompositeOperation='lighter';
  // duman halkası
  x.globalAlpha=.2+lvl*.15;
  for(const p of puffs){const a=p.a+t*.05*p.s+.1*Math.sin(t*p.s+p.p),rr=R*p.r*b*(1+.06*Math.sin(t*.7*p.s+p.p)),z=R*.9*p.z*(1+lvl*.3);
    x.drawImage(sp,cx+Math.cos(a)*rr-z/2,cy+Math.sin(a)*rr-z/2,z,z)}
  // ışınlar: sadece konuşurken
  if(lvl>0){
    const A=Math.min(1,lvl*2.5),bins=fb?fb.length*.6:0;
    for(let i=0;i<N;i++){const r=rays[i];
      const v=an&&now-extT>=300?fb[Math.floor(Math.abs(i/N*2-1)*bins)]/255:.5+.5*Math.sin(t*(2+r.l*3)+r.p);
      r.v+=(v-r.v)*.25;
      const r0=R*.35,r1=r0+R*(.5+2.3*lvl*r.l*(.35+.65*r.v)),ca=Math.cos(r.a),sa=Math.sin(r.a);
      const g=x.createLinearGradient(cx+ca*r0,cy+sa*r0,cx+ca*r1,cy+sa*r1);
      g.addColorStop(0,'rgba(255,230,150,.9)');g.addColorStop(.45,'rgba(255,70,60,.6)');g.addColorStop(1,'rgba(255,40,40,0)');
      x.strokeStyle=g;x.beginPath();x.moveTo(cx+ca*r0,cy+sa*r0);x.lineTo(cx+ca*r1,cy+sa*r1);
      x.globalAlpha=A*.25;x.lineWidth=3.5*D;x.stroke();x.globalAlpha=A;x.lineWidth=D;x.stroke()}
  }
  // çekirdek
  const cr=R*.85*b*(1+lvl*.18),g=x.createRadialGradient(cx,cy,0,cx,cy,cr);
  g.addColorStop(0,'rgba(255,250,225,1)');g.addColorStop(.25,'rgba(255,215,90,.95)');g.addColorStop(.6,'rgba(255,110,40,.35)');g.addColorStop(1,'rgba(255,50,30,0)');
  x.globalAlpha=1;x.fillStyle=g;x.beginPath();x.arc(cx,cy,cr,0,TAU);x.fill();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

let ac;
function mkAn(src,out){ac=ac||new AudioContext();ac.resume();an=ac.createAnalyser();an.fftSize=256;an.smoothingTimeConstant=.6;
  fb=new Uint8Array(an.frequencyBinCount);tb=new Uint8Array(an.fftSize);src.connect(an);if(out)an.connect(ac.destination)}
function speak(txt){if(!txt)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt),vs=speechSynthesis.getVoices();
  u.voice=vs.find(v=>/^tr/i.test(v.lang))||null;u.lang=u.voice?u.voice.lang:'tr-TR';u.pitch=.55;u.rate=.95;
  u.onstart=()=>spk=1;u.onend=u.onerror=()=>spk=0;u.onboundary=()=>pulse=1;speechSynthesis.speak(u)}
function connect(el){ac=ac||new AudioContext();mkAn(ac.createMediaElementSource(el),1)}
function play(url){const a=new Audio(url);a.crossOrigin='anonymous';connect(a);a.play()}
async function mic(){const s=await navigator.mediaDevices.getUserMedia({audio:true});ac=ac||new AudioContext();mkAn(ac.createMediaStreamSource(s),0)}
window.Ultron={speak,connect,play,mic,level:v=>{ext=v;extT=performance.now()}};

document.getElementById('f').onsubmit=e=>{e.preventDefault();const i=document.getElementById('i');speak(i.value);i.value=''};
document.getElementById('m').onclick=()=>mic().catch(()=>{});
// Masaüstü asistan bağlantısı: index.html?ws=ws://localhost:8765
// Mesajlar: {"say":"metin"} | {"level":0..1} | {"audio":"url"}
const q=new URLSearchParams(location.search).get('ws');
if(q)(function ws(){const s=new WebSocket(q);s.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.say)speak(m.say);if(m.level!=null)Ultron.level(+m.level);if(m.audio)play(m.audio)}catch{}};s.onclose=()=>setTimeout(ws,2000)})();
</script></body></html>
