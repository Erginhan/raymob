<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Water Sort Endless</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&display=swap">
<style>
  html, body { margin: 0; height: 100%; background: #06070A; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas {
    display: block;
    width: min(100vw, 56.25vh);
    max-width: 100vw;
    max-height: 100vh;
    height: auto;
    aspect-ratio: 9 / 16;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
(() => {
  'use strict';

  const W = 1080, H = 1920, CAP = 4;
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const FONT = '"Outfit", "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

  // Board geometry. Tubes scale so the board fills the available area for every level.
  const BOARD = { top: 350, bottom: 1740, width: 960, gx: 44, gy: 40 };
  const RATIO = 2.05;      // tube height / tube width
  const MAX_TW = 300;      // largest tube width (used on early levels)
  const MAX_GY = 120;      // largest gap between rows when the board has few rows
  const VOLUMES = [0.3, 0.6, 1];
  const STAG = 0.045, UNIT_DUR = 0.28;
  const SAMPLE_SHOP = [[0, 1, 2, 3], [3, 0, 1, 2], []];
  const SAMPLE_MENU = [[0, 4, 1, 3], [6, 6, 2, 2], [3, 5, 0, 1]];

  // ---------- Themes ----------
  const THEMES = [
    { id: 'obsidian', name: 'Obsidian', price: 0, bg: ['#1B2029', '#06070A'], glow: '#6E8BFF', ink: '#F3F5FA', muted: '#A9B2C3',
      accent: '#7C9CFF', accent2: '#B38CFF', card: '#151A22', panel: 'rgba(255,255,255,0.06)', line: 'rgba(255,255,255,0.10)',
      tubeFill: 'rgba(255,255,255,0.05)', tubeEdge: 'rgba(255,255,255,0.22)',
      colors: ['#FF5D6C', '#3D9BFF', '#3EDB9A', '#FFD35C', '#B68CFF', '#FF9A42', '#4FD8F0', '#FF7CC0', '#B08A6A', '#B9E75A', '#4F62D6', '#E65CFF', '#8A97A8', '#F2F4F8'] },
    { id: 'emerald', name: 'Emerald', price: 200, bg: ['#0F2D26', '#031412'], glow: '#34D399', ink: '#E9FFF6', muted: '#9CC9B8',
      accent: '#34D399', accent2: '#0FA676', card: '#0E2620', panel: 'rgba(255,255,255,0.06)', line: 'rgba(255,255,255,0.10)',
      tubeFill: 'rgba(200,255,230,0.05)', tubeEdge: 'rgba(200,255,230,0.20)',
      colors: ['#FF6B6B', '#38BDF8', '#A3E635', '#FACC15', '#C084FC', '#FB923C', '#22D3EE', '#F472B6', '#D6A77A', '#86EFAC', '#6366F1', '#F0ABFC', '#94A3B8', '#F8FAFC'] },
    { id: 'ocean', name: 'Ocean Deep', price: 200, pattern: 'bubbles', bg: ['#0D2B4D', '#02101F'], glow: '#38BDF8', ink: '#EAF6FF', muted: '#9DBBD6',
      accent: '#38BDF8', accent2: '#2563EB', card: '#0B2440', panel: 'rgba(255,255,255,0.06)', line: 'rgba(255,255,255,0.10)',
      tubeFill: 'rgba(190,230,255,0.05)', tubeEdge: 'rgba(190,230,255,0.20)',
      colors: ['#FF8A80', '#4FC3F7', '#69F0AE', '#FFE082', '#B39DDB', '#7C4DFF', '#18FFFF', '#F48FB1', '#BCAAA4', '#DCE775', '#5C6BC0', '#E040FB', '#4DB6AC', '#FFFFFF'] },
    { id: 'velvet', name: 'Velvet Night', price: 300, pattern: 'stars', bg: ['#2B1647', '#0C0617'], glow: '#C084FC', ink: '#F5EEFF', muted: '#B7A6CF',
      accent: '#D946EF', accent2: '#8B5CF6', card: '#22113A', panel: 'rgba(255,255,255,0.06)', line: 'rgba(255,255,255,0.10)',
      tubeFill: 'rgba(230,200,255,0.05)', tubeEdge: 'rgba(230,200,255,0.20)',
      colors: ['#FF5C8A', '#60A5FA', '#4ADE80', '#FDE047', '#E879F9', '#F97316', '#2DD4BF', '#F9A8D4', '#C4A483', '#BEF264', '#818CF8', '#A855F7', '#CBD5E1', '#FFF7ED'] },
    { id: 'rose', name: 'Rose Gold', price: 400, bg: ['#3B2429', '#120A0C'], glow: '#F4A6A6', ink: '#FFF1EC', muted: '#D2B5AE',
      accent: '#F2A7A0', accent2: '#E0A96D', card: '#2A1A1E', panel: 'rgba(255,255,255,0.06)', line: 'rgba(255,220,210,0.12)',
      tubeFill: 'rgba(255,230,220,0.05)', tubeEdge: 'rgba(255,230,220,0.20)',
      colors: ['#F26D6D', '#7FB8E8', '#8ED1A8', '#F5D26B', '#B9A0E6', '#F29E68', '#6CC7C4', '#E992B8', '#B08D6E', '#CDE58A', '#6F80C9', '#D781E0', '#AAB3BF', '#FBF3EE'] },
    { id: 'neon', name: 'Neon Arcade', price: 450, pattern: 'grid', bg: ['#1E0638', '#05000F'], glow: '#FF2A6D', ink: '#F7F0FF', muted: '#B9A8D6',
      accent: '#05D9E8', accent2: '#FF2A6D', card: '#14062A', panel: 'rgba(255,255,255,0.05)', line: 'rgba(5,217,232,0.22)',
      tubeFill: 'rgba(5,217,232,0.05)', tubeEdge: 'rgba(5,217,232,0.45)',
      colors: ['#FF2A6D', '#05D9E8', '#39FF14', '#FFE600', '#B967FF', '#FF9F1C', '#01C38D', '#FF71CE', '#FF5E00', '#A8FF60', '#3A86FF', '#00B4D8', '#00F5D4', '#FFFFFF'] },
    { id: 'gold', name: 'Gold Luxe', price: 600, bg: ['#2C2212', '#0A0802'], glow: '#F5C451', ink: '#FFF6DE', muted: '#CDBB8E',
      accent: '#F5C451', accent2: '#C9921F', card: '#211A0E', panel: 'rgba(255,240,200,0.06)', line: 'rgba(245,196,81,0.16)',
      tubeFill: 'rgba(255,240,200,0.05)', tubeEdge: 'rgba(245,196,81,0.35)',
      colors: ['#E5484D', '#3E8EDE', '#30A46C', '#F5C451', '#8E4EC6', '#F76B15', '#12A594', '#D6409F', '#A0522D', '#8DB600', '#3A4FA8', '#B23CFD', '#8B8D98', '#EDEDED'] },
    { id: 'arctic', name: 'Arctic', price: 250, bg: ['#1B3550', '#060F1A'], glow: '#8FE3FF', ink: '#EEF9FF', muted: '#A6C8DC',
      accent: '#8FE3FF', accent2: '#5AA9FF', card: '#0E2238', panel: 'rgba(255,255,255,0.06)', line: 'rgba(190,235,255,0.14)',
      tubeFill: 'rgba(200,240,255,0.05)', tubeEdge: 'rgba(200,240,255,0.26)', pattern: 'snow',
      colors: ['#FF7B89', '#3E7BFF', '#7CF5C4', '#FFFFFF', '#F472B6', '#FFB4A2', '#2EC4B6', '#FFD166', '#D4A373', '#B5E48C', '#1D4ED8', '#F9E79F', '#94A3B8', '#C4B5FD'] },
    { id: 'matcha', name: 'Matcha', price: 250, bg: ['#26331E', '#0B1109'], glow: '#A7C957', ink: '#F1F7E8', muted: '#B5C7A0',
      accent: '#A7C957', accent2: '#6A994E', card: '#18220F', panel: 'rgba(255,255,255,0.05)', line: 'rgba(200,230,170,0.14)',
      tubeFill: '#1B2716', tubeEdge: 'rgba(200,230,170,0.25)', flat: true,
      colors: ['#E76F51', '#F4A261', '#E9C46A', '#2A9D8F', '#8AB17D', '#E5989B', '#4CC9F0', '#6D597A', '#FFCDB2', '#9C6644', '#457B9D', '#A8DADC', '#B8C0FF', '#FEFAE0'] },
    { id: 'ember', name: 'Ember', price: 350, bg: ['#3F1409', '#0D0302'], glow: '#FF6A2B', ink: '#FFF1E8', muted: '#E3B9A6',
      accent: '#FF7A3D', accent2: '#FFC247', card: '#260E08', panel: 'rgba(255,255,255,0.06)', line: 'rgba(255,170,130,0.14)',
      tubeFill: 'rgba(255,200,170,0.05)', tubeEdge: 'rgba(255,200,170,0.24)', pattern: 'embers',
      colors: ['#FF4D4D', '#FF8A3D', '#FFE066', '#FF7EB3', '#C0392B', '#B5E655', '#B388FF', '#5DD39E', '#4FC3F7', '#FFD6A5', '#FFF59D', '#26A69A', '#8D6E63', '#F5F5F5'] },
    { id: 'aurora', name: 'Aurora', price: 400, bg: ['#0A1F33', '#02060D'], glow: '#2DD4BF', ink: '#EFFFFB', muted: '#9FD9CF',
      accent: '#5EEAD4', accent2: '#A78BFA', card: '#0B1D2E', panel: 'rgba(255,255,255,0.05)', line: 'rgba(94,234,212,0.16)',
      tubeFill: 'rgba(200,255,250,0.05)', tubeEdge: 'rgba(200,255,250,0.22)', pattern: 'aurora',
      colors: ['#5EEAD4', '#A78BFA', '#F0ABFC', '#FDE68A', '#34D399', '#60A5FA', '#FB7185', '#C4B5FD', '#FB923C', '#FBBF24', '#22D3EE', '#E879F9', '#4ADE80', '#F8FAFC'] },
    { id: 'sandstone', name: 'Sandstone', price: 500, bg: ['#4A3623', '#140E08'], glow: '#E9B872', ink: '#FFF4E0', muted: '#D6BE98',
      accent: '#E9B872', accent2: '#D9825B', card: '#2A1F15', panel: 'rgba(255,240,210,0.06)', line: 'rgba(233,184,114,0.16)',
      tubeFill: 'rgba(255,230,190,0.05)', tubeEdge: 'rgba(255,230,190,0.24)', pattern: 'waves',
      colors: ['#D1495B', '#EDAE49', '#00798C', '#30638E', '#8F2D56', '#66A182', '#F18F01', '#6C8EBF', '#A8DADC', '#E63946', '#B8A9C9', '#B56576', '#6D6875', '#F1FAEE'] },
  ];
  // Cheapest first, so the shop reads as a progression.
  THEMES.sort((a, b) => a.price - b.price);
  const T = () => THEMES.find(t => t.id === data.theme) || THEMES[0];

  // ---------- Save data ----------
  const SAVE_KEY = 'water-sort-endless-v2';
  const OLD_KEY = 'water-sort-endless-v1';
  const OLD_THEME_MAP = { classic: 'obsidian', forest: 'emerald', midnight: 'velvet', pastel: 'rose', sunset: 'gold' };
  function freshData() {
    return { level: 1, best: 0, coins: 0, owned: ['obsidian'], theme: 'obsidian',
      settings: { sfx: true, volume: 1, haptics: true, animations: true, symbols: false } };
  }
  function normalize(d) {
    const out = Object.assign(freshData(), d);
    out.settings = Object.assign(freshData().settings, d.settings || {});
    out.owned = (Array.isArray(out.owned) ? out.owned : []).filter(id => THEMES.some(t => t.id === id));
    if (!out.owned.includes('obsidian')) out.owned.unshift('obsidian');
    if (!THEMES.some(t => t.id === out.theme) || !out.owned.includes(out.theme)) out.theme = 'obsidian';
    out.level = Math.max(1, out.level | 0);
    out.best = Math.max(0, out.best | 0);
    out.coins = Math.max(0, out.coins | 0);
    return out;
  }
  function loadData() {
    try {
      const current = localStorage.getItem(SAVE_KEY);
      if (current) return normalize(JSON.parse(current));
      const old = JSON.parse(localStorage.getItem(OLD_KEY) || 'null');
      if (old) {
        const d = freshData();
        d.level = old.level; d.best = old.best; d.coins = old.coins;
        d.owned = (old.owned || []).map(id => OLD_THEME_MAP[id] || id);
        d.theme = OLD_THEME_MAP[old.theme] || old.theme;
        d.settings.sfx = old.sound !== false;
        return normalize(d);
      }
    } catch (e) { /* unreadable storage: start fresh */ }
    return normalize(freshData());
  }
  function saveData() {
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(data)); } catch (e) { /* storage may be blocked */ }
  }
  let data = loadData();

  // ---------- Sound (synthesized with WebAudio, no files needed) ----------
  let actx = null, master = null, noiseBuf = null;
  function applyVolume() {
    if (master) master.gain.value = VOLUMES[data.settings.volume] * 0.5;
  }
  function audio() {
    if (!actx) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        actx = new AC();
        master = actx.createGain();
        master.connect(actx.destination);
        applyVolume();
      } catch (e) { actx = null; }
    }
    if (actx && actx.state === 'suspended') actx.resume();
    return actx;
  }
  function tone(freq, dur, o = {}) {
    if (!data.settings.sfx) return;
    const a = audio(); if (!a) return;
    const t0 = a.currentTime + (o.delay || 0);
    const osc = a.createOscillator(), g = a.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (o.slide) osc.frequency.exponentialRampToValueAtTime(o.slide, t0 + dur);
    const v = o.vol || 0.2;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g); g.connect(master);
    osc.start(t0); osc.stop(t0 + dur + 0.05);
  }
  function splash(dur, vol) {
    if (!data.settings.sfx) return;
    const a = audio(); if (!a) return;
    if (!noiseBuf) {
      noiseBuf = a.createBuffer(1, Math.floor(a.sampleRate * 0.3), a.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const src = a.createBufferSource(); src.buffer = noiseBuf;
    const f = a.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 1200; f.Q.value = 1.2;
    const g = a.createGain(), t0 = a.currentTime;
    g.gain.setValueAtTime(vol, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t0); src.stop(t0 + dur);
  }
  const SFX = {
    select: () => tone(660, 0.07, { type: 'triangle', vol: 0.25 }),
    drop: () => { tone(330, 0.12, { slide: 520, vol: 0.2 }); splash(0.16, 0.12); },
    error: () => tone(170, 0.2, { type: 'square', slide: 120, vol: 0.08 }),
    click: () => tone(520, 0.05, { type: 'triangle', vol: 0.2 }),
    win: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.25, { type: 'triangle', vol: 0.25, delay: i * 0.1 })),
    coin: () => { tone(988, 0.08, { type: 'square', vol: 0.08 }); tone(1319, 0.16, { type: 'square', vol: 0.08, delay: 0.07 }); },
    buy: () => { tone(784, 0.1, { type: 'triangle', vol: 0.2 }); tone(1047, 0.2, { type: 'triangle', vol: 0.2, delay: 0.09 }); },
  };
  function buzz(ms) {
    if (data.settings.haptics && navigator.vibrate) navigator.vibrate(ms);
  }

  // ---------- Puzzle rules ----------
  const clone = t => t.map(c => c.slice());
  const top = c => (c.length ? c[c.length - 1] : -1);
  function blockLen(c) {
    let n = 0; const v = top(c);
    for (let k = c.length - 1; k >= 0 && c[k] === v; k--) n++;
    return n;
  }
  function why(t, a, b) {
    if (!t[a].length) return 'That tube is empty';
    if (a === b) return 'Same tube';
    if (t[b].length >= CAP) return 'That tube is full';
    if (t[b].length && top(t[b]) !== top(t[a])) return 'Colors do not match';
    return null;
  }
  function pour(t, a, b) {
    const n = Math.min(blockLen(t[a]), CAP - t[b].length), v = top(t[a]);
    for (let k = 0; k < n; k++) { t[a].pop(); t[b].push(v); }
  }
  function isSolved(t) {
    return t.every(c => !c.length || (c.length === CAP && c.every(x => x === c[0])));
  }

  // Depth-first solver with a node budget. Used to reject unsolvable random levels.
  function solvable(start, budget) {
    const seen = new Set();
    let nodes = 0;
    const key = t => t.map(c => c.join(',')).join('|');
    function dfs(t) {
      if (isSolved(t)) return true;
      if (++nodes > budget) return false;
      const k = key(t);
      if (seen.has(k)) return false;
      seen.add(k);
      const moves = [];
      for (let a = 0; a < t.length; a++) {
        if (!t[a].length) continue;
        const whole = blockLen(t[a]) === t[a].length;
        for (let b = 0; b < t.length; b++) {
          if (why(t, a, b)) continue;
          if (!t[b].length && whole) continue; // moving a whole tube into an empty one gains nothing
          moves.push([(t[b].length ? 2 : 0) + (whole ? 1 : 0), a, b]);
        }
      }
      moves.sort((x, y) => y[0] - x[0]);
      for (const m of moves) {
        const nt = clone(t);
        pour(nt, m[1], m[2]);
        if (dfs(nt)) return true;
        if (nodes > budget) return false;
      }
      return false;
    }
    return dfs(start);
  }

  // Deterministic PRNG, so a level always generates the same board.
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Difficulty ramps with the level: more colors (up to 14) and a longer scramble.
  function makeLevel(level) {
    const colors = Math.min(14, 4 + Math.floor((level - 1) / 3));
    const depth = 30 + level * 4;
    for (let attempt = 0; ; attempt++) {
      const r = rng(level * 7919 + attempt * 104729 + 1);
      const t = [];
      for (let c = 0; c < colors; c++) t.push(Array(CAP).fill(c));
      t.push([], []); // two empty tubes to work with
      for (let i = 0; i < depth; i++) {
        const src = [], dst = [];
        for (let j = 0; j < t.length; j++) if (t[j].length) src.push(j);
        const a = src[Math.floor(r() * src.length)];
        for (let j = 0; j < t.length; j++) if (j !== a && t[j].length < CAP) dst.push(j);
        if (!dst.length) continue;
        const b = dst[Math.floor(r() * dst.length)];
        const mx = Math.min(blockLen(t[a]), CAP - t[b].length);
        const n = 1 + Math.floor(r() * mx), v = top(t[a]);
        for (let k = 0; k < n; k++) { t[a].pop(); t[b].push(v); }
      }
      if (!isSolved(t) && solvable(clone(t), 20000)) return { tubes: t, colors };
    }
  }
  const levelCache = new Map();
  function levelFor(level) {
    if (!levelCache.has(level)) levelCache.set(level, makeLevel(level));
    return levelCache.get(level);
  }

  // ---------- Layout ----------
  // Picks the column count that gives the largest tubes while the board fills the area.
  const layoutCache = new Map();
  function layoutFor(n) {
    if (layoutCache.has(n)) return layoutCache.get(n);
    const areaH = BOARD.bottom - BOARD.top;
    let best = null;
    for (let cols = 2; cols <= 6; cols++) {
      const rows = Math.ceil(n / cols);
      const wFit = (BOARD.width - (cols - 1) * BOARD.gx) / cols;
      const hFit = (areaH - (rows - 1) * BOARD.gy) / (rows * RATIO);
      // A last row with a single tube looks unbalanced, so it is scaled down.
      const lastRow = n - (rows - 1) * cols;
      const balance = lastRow >= Math.ceil(cols / 2) ? 1 : 0.8;
      const tw = Math.min(MAX_TW, wFit, hFit) * balance;
      const tH = tw * RATIO;
      const gy = rows > 1 ? Math.min(MAX_GY, Math.max(BOARD.gy, (areaH - rows * tH) / (rows - 1))) : 0;
      const fill = (rows * tH + (rows - 1) * gy) / areaH;
      // Favour big tubes, but prefer a board that fills the screen.
      const score = tw * (0.75 + 0.25 * fill);
      if (!best || score > best.score + 0.5) best = { cols, rows, tw, tH, gy, score };
    }
    const { cols, rows, tw, tH, gy } = best;
    const totalH = rows * tH + (rows - 1) * gy;
    const top0 = BOARD.top + (areaH - totalH) / 2;
    const rects = [];
    for (let r = 0; r < rows; r++) {
      const k = Math.min(cols, n - r * cols);
      const rowW = k * tw + (k - 1) * BOARD.gx;
      const x0 = (W - rowW) / 2;
      for (let c = 0; c < k; c++) rects.push({ x: x0 + c * (tw + BOARD.gx), y: top0 + r * (tH + gy), w: tw, h: tH });
    }
    const lay = { rects, lift: Math.round(tw * 0.2) };
    layoutCache.set(n, lay);
    return lay;
  }
  function geom(r) {
    const padX = r.w * 0.11, padV = r.w * 0.12;
    const slotH = (r.h - 2 * padV) / CAP;
    const gap = slotH * 0.05;
    return { padX, padV, slotH, gap, unitW: r.w - 2 * padX, unitH: slotH - 2 * gap };
  }
  // Rectangle of the j-th unit slot in a tube (slot 0 is the bottom).
  function slotRect(r, j) {
    const g = geom(r);
    return { x: r.x + g.padX, y: r.y + r.h - g.padV - (j + 1) * g.slotH + g.gap, w: g.unitW, h: g.unitH };
  }

  // ---------- Game state ----------
  let screen = 'menu';
  const game = { level: 0, colors: 0, tubes: [], start: [], hist: [], sel: -1, lift: [], won: false, usedUndo: false, reward: 0, status: '', anim: null };
  let ui = [], pressKey = null, fade = 0, toast = null, confetti = [];
  let resetArmedAt = -Infinity;

  function startLevel() {
    const L = levelFor(data.level);
    Object.assign(game, {
      level: data.level, colors: L.colors, start: L.tubes, tubes: clone(L.tubes),
      hist: [], sel: -1, won: false, usedUndo: false, reward: 0, status: 'Tap a tube to pick it up', anim: null,
    });
    game.lift = L.tubes.map(() => 0);
    confetti = [];
  }
  function restart() {
    if (game.won || game.anim) { SFX.error(); return; }
    SFX.click();
    game.tubes = clone(game.start);

  function checkWin() {
    if (!isSolved(game.tubes)) return;
    game.won = true; game.sel = -1;

  // ---------- Drawing helpers ----------
  const setFont = (size, weight = 700) => { ctx.font = `${weight} ${size}px ${FONT}`; };
  function text(str, x, y, size, color, o = {}) {
    ctx.save();
    setFont(size, o.weight || 700);
    ctx.fillStyle = color;
    ctx.textAlign = o.align || 'center';
    ctx.textBaseline = 'middle';
    if (o.spacing) ctx.letterSpacing = o.spacing + 'px';

  function measure(str, size, weight = 700, spacing = 0) {

    setFont(size, weight);

    ctx.restore();
    return w;
  }
  function rr(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();

  function card(x, y, w, h, r, fill, stroke) {
    rr(x, y, w, h, r);

  }
  const rgb = hex => { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
  const mix = (hex, to, p) => { const a = rgb(hex), b = rgb(to); return `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * p)).join(',')})`; };
  const hexA = (hex, a) => { const [r, g, b] = rgb(hex); return `rgba(${r},${g},${b},${a})`; };
  const isLight = hex => { const [r, g, b] = rgb(hex); return (r * 0.299 + g * 0.587 + b * 0.114) / 255 > 0.6; };
  const onAccent = th => (isLight(th.accent) ? '#0B0D12' : '#FFFFFF');
  const hgrad = (x0, x1, a, b) => { const g = ctx.createLinearGradient(x0, 0, x1, 0); g.addColorStop(0, a); g.addColorStop(1, b); return g; };
  const vgrad = (y0, y1, a, b) => { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, a); g.addColorStop(1, b); return g; };
  function background(th) {
    ctx.fillStyle = vgrad(0, H, th.bg[0], th.bg[1]);

    const g = ctx.createRadialGradient(W / 2, 260, 60, W / 2, 260, 980);
    g.addColorStop(0, hexA(th.glow, 0.20));
    g.addColorStop(1, hexA(th.glow, 0));

    ctx.fillRect(0, 0, W, H);

  // Background decoration. Each theme can pick one pattern; particles are seeded per theme.
  const patternCache = new Map();
  const seedOf = s => { let h = 7; for (const ch of s) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h; };
  function particles(th, count) {
    if (!patternCache.has(th.id)) {
      const r = rng(seedOf(th.id));
      patternCache.set(th.id, Array.from({ length: count }, () => ({ x: r() * W, y: r() * H, s: 0.5 + r(), ph: r(), r: 1 + r() * 4 })));
    }
    return patternCache.get(th.id);
  }
  function drawPattern(th) {
    const t = time;
    switch (th.pattern) {
      case 'stars':
        for (const p of particles(th, 90)) {
          ctx.globalAlpha = 0.25 + 0.35 * (0.5 + 0.5 * Math.sin(t * 1.4 * p.s + p.ph * 6));
          ctx.fillStyle = th.ink;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.8, 0, Math.PI * 2); ctx.fill();
        }
        break;
      case 'bubbles':
        ctx.lineWidth = 3;
        for (const p of particles(th, 26)) {
          const y = H + 40 - ((t * 40 * p.s + p.ph * H) % (H + 80));
          ctx.strokeStyle = hexA(th.accent, 0.35);
          ctx.beginPath(); ctx.arc(p.x + Math.sin(t + p.ph * 9) * 16, y, 10 + p.r * 9, 0, Math.PI * 2); ctx.stroke();
        }
        break;
      case 'snow':
        for (const p of particles(th, 70)) {
          const y = ((p.ph + t * 0.035 * p.s) % 1) * (H + 40) - 20;
          ctx.globalAlpha = 0.3 + 0.2 * p.s;
          ctx.fillStyle = th.ink;
          ctx.beginPath(); ctx.arc(p.x + Math.sin(t * 0.6 + p.ph * 7) * 24, y, 1.5 + p.r * 0.8, 0, Math.PI * 2); ctx.fill();
        }
        break;
      case 'embers':
        for (const p of particles(th, 40)) {
          const f = (p.ph + t * 0.07 * p.s) % 1;

        }
        break;
      case 'grid':
        ctx.strokeStyle = hexA(th.accent, 0.07);
        ctx.lineWidth = 2;
        for (let x = 0; x <= W; x += 108) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
        for (let y = 0; y <= H; y += 108) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
        break;
      case 'waves':
        ctx.lineWidth = 3;
        ctx.strokeStyle = hexA(th.accent, 0.13);

          ctx.beginPath();

          g.addColorStop(0, hexA(col, 0.22));
          g.addColorStop(1, hexA(col, 0));
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(0, 0, 340, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }

  }

  // Lucide-style icons drawn on a 24-unit grid, centred on (cx, cy).

    ctx.moveTo(...P(9, 14)); ctx.lineTo(...P(4, 9)); ctx.lineTo(...P(9, 4));
    ctx.moveTo(...P(4, 9)); ctx.lineTo(...P(14.5, 9));

  // Buttons. Every call registers a hit area for this frame.
  function hit(key, x, y, w, h, on) { ui.push({ key, x, y, w, h, on }); }
  function pill(key, label, x, y, w, h, o = {}) {

  // ---------- Tubes and units ----------
  function drawSymbol(i, cx, cy, s, col) {
    const light = isLight(col);
    const kind = i % 8, solid = i < 8;
    ctx.save();
    ctx.beginPath();
    const poly = (n, rot, rad) => {
      for (let k = 0; k < n; k++) {
        const a = rot + k * 2 * Math.PI / n;
        const px = cx + rad * Math.cos(a), py = cy + rad * Math.sin(a);
        if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py);
      }
      ctx.closePath();
    };
    switch (kind) {
      case 0: ctx.arc(cx, cy, s, 0, Math.PI * 2); break;
      case 1: ctx.rect(cx - s * 0.85, cy - s * 0.85, s * 1.7, s * 1.7); break;
      case 2: poly(3, -Math.PI / 2, s * 1.05); break;
      case 3: poly(4, -Math.PI / 4, s * 1.1); break;
      case 4:
        for (let k = 0; k < 10; k++) {
          const a = -Math.PI / 2 + k * Math.PI / 5, rad = k % 2 ? s * 0.45 : s;
          const px = cx + rad * Math.cos(a), py = cy + rad * Math.sin(a);
          if (k) ctx.lineTo(px, py); else ctx.moveTo(px, py);
        }
        ctx.closePath();
        break;
      case 5: {
        const a = s * 0.42;
        ctx.moveTo(cx - a, cy - s); ctx.lineTo(cx + a, cy - s); ctx.lineTo(cx + a, cy - a); ctx.lineTo(cx + s, cy - a);
        ctx.lineTo(cx + s, cy + a); ctx.lineTo(cx + a, cy + a); ctx.lineTo(cx + a, cy + s); ctx.lineTo(cx - a, cy + s);
        ctx.lineTo(cx - a, cy + a); ctx.lineTo(cx - s, cy + a); ctx.lineTo(cx - s, cy - a); ctx.lineTo(cx - a, cy - a);
        ctx.closePath();
        break;
      }
      case 6: poly(6, 0, s); break;
      case 7:
        ctx.arc(cx, cy, s, 0, Math.PI * 2);
        ctx.moveTo(cx + s * 0.5, cy); ctx.arc(cx, cy, s * 0.5, 0, Math.PI * 2, true);
        break;
    }
    const fg = light ? 'rgba(12,14,20,0.82)' : 'rgba(255,255,255,0.92)';
    if (solid || kind === 7) { ctx.fillStyle = fg; ctx.fill(kind === 7 ? 'evenodd' : 'nonzero'); }
    else { ctx.strokeStyle = fg; ctx.lineWidth = s * 0.3; ctx.lineJoin = 'round'; ctx.stroke(); }
    ctx.restore();
  }
  function drawUnit(c, th, s) {
    const col = th.colors[c];
    const rad = Math.min(s.w, s.h) * 0.22;
    if (th.flat) {
      // Flat themes use solid units with no gloss.
      rr(s.x, s.y, s.w, s.h, rad);
      ctx.fillStyle = col; ctx.fill();
    } else {
      const g = ctx.createLinearGradient(0, s.y, 0, s.y + s.h);
      g.addColorStop(0, mix(col, '#FFFFFF', 0.25));
      g.addColorStop(1, mix(col, '#000000', 0.18));
      rr(s.x, s.y, s.w, s.h, rad);
      ctx.fillStyle = g; ctx.fill();
      rr(s.x + s.w * 0.08, s.y + s.h * 0.12, s.w * 0.84, Math.max(2, s.h * 0.08), s.h * 0.04);
      ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fill();
    }
    if (data.settings.symbols) drawSymbol(c, s.x + s.w / 2, s.y + s.h / 2, Math.min(s.w, s.h) * 0.24, col);
  }
  function drawTube(units, th, r, o = {}) {
    const y = r.y - (o.lift || 0);
    const rad = r.w * 0.2;
    const box = { x: r.x, y, w: r.w, h: r.h };
    ctx.save();
    if (o.selected) { ctx.shadowColor = hexA(th.accent, 0.85); ctx.shadowBlur = 42; }
    else { ctx.shadowColor = 'rgba(0,0,0,0.45)'; ctx.shadowBlur = 36; ctx.shadowOffsetY = 16; }
    rr(box.x, box.y, box.w, box.h, rad);

    ctx.restore();
    for (let j = 0; j < units.length; j++) drawUnit(units[j], th, slotRect(box, j));

      rr(box.x + r.w * 0.09, box.y + r.h * 0.03, r.w * 0.06, r.h * 0.94, r.w * 0.03);

    ctx.strokeStyle = o.selected ? th.accent : th.tubeEdge;
    ctx.stroke();

  // Units flying from the source tube into the target tube.
  function drawPourAnim(th, a) {
    const lay = layoutFor(game.tubes.length);
    const src = lay.rects[a.from], dst = lay.rects[a.to];
    const size = slotRect(dst, 0);
    const sx = src.x + src.w / 2, sy = src.y - a.lift0 + geom(src).padV;
    for (let k = 0; k < a.n; k++) {
      const local = Math.min(1, Math.max(0, (a.t - k * STAG) / UNIT_DUR));
      if (local <= 0) continue;
      const e = local < 0.5 ? 4 * local * local * local : 1 - Math.pow(-2 * local + 2, 3) / 2;
      const slot = slotRect(dst, a.before + k);
      const ex = slot.x + slot.w / 2, ey = slot.y + slot.h / 2;
      const cx = (sx + ex) / 2, cy = Math.min(sy, ey) - 240;
      const x = (1 - e) * (1 - e) * sx + 2 * (1 - e) * e * cx + e * e * ex;
      const y = (1 - e) * (1 - e) * sy + 2 * (1 - e) * e * cy + e * e * ey;
      drawUnit(a.color, th, { x: x - size.w / 2, y: y - size.h / 2, w: size.w, h: size.h });
    }
  }

  // ---------- Screens ----------
  function drawMenu(th, t) {
    background(th);
    text('WATER', W / 2, 330, 150, th.ink, { weight: 800, spacing: 12 });
    text('SORT', W / 2, 478, 150, hgrad(W / 2 - 240, W / 2 + 240, th.accent, th.accent2), { weight: 800, spacing: 12 });
    text('ENDLESS PUZZLE', W / 2, 580, 30, th.muted, { weight: 600, spacing: 12 });

    const tw = 180, tH = tw * RATIO, gap = 64, x0 = (W - (3 * tw + 2 * gap)) / 2;
    SAMPLE_MENU.forEach((units, k) => {
      const active = k === 1;
      const lift = active ? 26 + Math.sin(t * 1.8) * 10 : 0;
      drawTube(units, th, { x: x0 + k * (tw + gap), y: 690, w: tw, h: tH }, { lift, selected: active });
    });

    card(140, 1120, 800, 240, 44, th.card, th.line);
    const cols = [270, 540, 810];
    text('LEVEL', cols[0], 1180, 26, th.muted, { weight: 700, spacing: 6 });
    text('BEST', cols[1], 1180, 26, th.muted, { weight: 700, spacing: 6 });
    text('COINS', cols[2], 1180, 26, th.muted, { weight: 700, spacing: 6 });
    text(String(data.level), cols[0], 1277, 84, th.ink, { weight: 800 });
    text(String(data.best), cols[1], 1277, 84, th.ink, { weight: 800 });
    // Shrink the coin total if it is too wide for its column.
    const coinsStr = String(data.coins);
    const size = Math.min(84, 84 * 190 / Math.max(1, measure(coinsStr, 84, 800)));
    const cw = measure(coinsStr, size, 800);
    const startX = cols[2] - (cw + 66) / 2;
    coin(startX + 24, 1277, 24);
    text(coinsStr, startX + 64, 1277, size, th.ink, { align: 'left', weight: 800 });
    ctx.fillStyle = th.line;
    ctx.fillRect(405, 1160, 2, 150); ctx.fillRect(675, 1160, 2, 150);

    pill('play', `PLAY LEVEL ${data.level}`, 160, 1420, 760, 150, { grad: true, size: 50, on: () => {
      SFX.click();
      if (game.level !== data.level || !game.tubes.length) startLevel();
      go('game');
    } });
    pill('shop', 'SHOP', 160, 1606, 362, 130, { size: 40, on: () => { SFX.click(); go('shop'); } });
    pill('settings', 'SETTINGS', 558, 1606, 362, 130, { size: 40, on: () => { SFX.click(); go('settings'); } });
    text('Progress is saved on this device', W / 2, 1830, 26, th.muted, { weight: 500, alpha: 0.8 });
  }

  function drawGame(th) {
    background(th);
    pill('back', '', 50, 50, 110, 110, { r: 55, icon: iconBack, iconSize: 36, on: goBack });
    text(`LEVEL ${game.level}`, W / 2, 92, 66, th.ink, { weight: 800, spacing: 6 });
    text(`${game.colors} colors  ·  ${game.hist.length} moves`, W / 2, 152, 28, th.muted, { weight: 600, spacing: 2 });
    coinPill(1030, 50, data.coins, th);

    const sw = measure(game.status, 30, 600) + 64;
    card(W / 2 - sw / 2, 196, sw, 56, 28, th.panel);
    text(game.status, W / 2, 224, 30, th.ink, { weight: 600, alpha: 0.9 });

    const lay = layoutFor(game.tubes.length);
    game.tubes.forEach((units, i) => {
      const hidden = game.anim && game.anim.to === i ? game.anim.n : 0;
      drawTube(hidden ? units.slice(0, units.length - hidden) : units, th, lay.rects[i], {
        lift: game.lift[i] || 0, selected: game.sel === i,
      });
    });
    if (game.anim) drawPourAnim(th, game.anim);

    const busy = !!game.anim;
    pill('undo', 'Undo', 180, 1775, 340, 104, { icon: iconUndo, iconSize: 40, group: true, size: 38,
      fill: th.panel, stroke: th.line, disabled: game.won || busy || !game.hist.length, on: undo });
    pill('restart', 'Restart', 560, 1775, 340, 104, { icon: iconRestart, iconSize: 40, group: true, size: 38,
      fill: th.panel, stroke: th.line, disabled: game.won || busy, on: restart });

    if (game.won && !busy) drawWin(th);
    drawConfetti();
  }

  function drawWin(th) {
    ctx.fillStyle = 'rgba(4,5,8,0.7)';
    ctx.fillRect(0, 0, W, H);
    const x = 140, y = 520, w = 800, h = 700;
    card(x, y, w, h, 48, th.card, th.line);
    text(`LEVEL ${game.level} CLEARED`, W / 2, y + 74, 28, th.accent, { weight: 700, spacing: 8 });
    text('Well sorted', W / 2, y + 160, 88, th.ink, { weight: 800 });
    const str = `+${game.reward}`;
    const numW = measure(str, 140, 800);
    const sx = W / 2 - (numW + 90) / 2;
    coin(sx + 40, y + 300, 42);
    text(str, sx + 96, y + 302, 140, th.ink, { align: 'left', weight: 800 });
    const base = 10 + game.level;
    const row = (ry, label, value) => {
      text(label, x + 80, ry, 34, th.muted, { align: 'left', weight: 600 });
      text(value, x + w - 80, ry, 36, th.ink, { align: 'right', weight: 800 });
    };
    row(y + 420, 'Level reward', `+${base}`);
    row(y + 470, game.usedUndo ? 'Undo was used' : 'No-undo bonus', game.usedUndo ? '—' : `+${game.reward - base}`);
    pill('next', 'Next level', x + (w - 520) / 2, y + 540, 520, 120, { grad: true, size: 46, on: () => { SFX.click(); startLevel(); } });
  }

  // The shop lists every theme in a two-column grid that scrolls under the header.
  const SHOP_VIEW = { top: 250, bottom: 1790 };
  const SHOP_TOP = 290;
  let shopScroll = 0;
  const shopRows = () => Math.ceil(THEMES.length / 2);
  function shopMaxScroll() {
    const contentBottom = SHOP_TOP + (shopRows() - 1) * 380 + 340;
    return Math.max(0, contentBottom - SHOP_VIEW.bottom + 30);
  }

  function drawShop(th) {
    background(th);
    header(th, 'Shop', 'Themes for your board', true);
    const max = shopMaxScroll();
    shopScroll = Math.max(0, Math.min(max, shopScroll));
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, SHOP_VIEW.top, W, SHOP_VIEW.bottom - SHOP_VIEW.top);
    ctx.clip();
    THEMES.forEach((item, k) => {
      const col = k % 2, row = Math.floor(k / 2);
      const x = 80 + col * 480, y = SHOP_TOP + row * 380 - shopScroll, w = 440, h = 340;
      if (y + h < SHOP_VIEW.top || y > SHOP_VIEW.bottom) return;
      const owned = data.owned.includes(item.id), equipped = data.theme === item.id;
      rr(x, y, w, h, 36);
      ctx.fillStyle = vgrad(y, y + h, item.bg[0], item.bg[1]);
      ctx.fill();
      rr(x, y, w, h, 36);
      ctx.lineWidth = equipped ? 6 : 2;
      ctx.strokeStyle = equipped ? item.accent : item.line;
      ctx.stroke();

      const tw = 62, gap = 24, px0 = x + (w - (3 * tw + 2 * gap)) / 2;
      SAMPLE_SHOP.forEach((units, j) => drawTube(units, item, { x: px0 + j * (tw + gap), y: y + 30, w: tw, h: tw * RATIO }, {}));
      text(item.name, x + 36, y + 206, 46, item.ink, { align: 'left', weight: 800 });

      if (equipped || owned) {
        const label = equipped ? 'EQUIPPED' : 'OWNED';
        const tagW = measure(label, 22, 700, 3) + 40;
        rr(x + 36, y + 254, tagW, 46, 23);
        ctx.fillStyle = equipped ? item.accent : 'rgba(255,255,255,0.10)';
        ctx.fill();
        text(label, x + 36 + tagW / 2, y + 277, 22, equipped ? (isLight(item.accent) ? '#0B0D12' : '#FFFFFF') : item.ink, { weight: 700, spacing: 3 });
      } else {
        const afford = data.coins >= item.price;
        coin(x + 54, y + 277, 19);
        text(String(item.price), x + 84, y + 277, 38, item.ink, { align: 'left', weight: 800, alpha: afford ? 1 : 0.5 });
        text(afford ? 'Tap to unlock' : `Need ${item.price - data.coins} more`, x + 36, y + 312, 24, item.muted, { align: 'left', weight: 600 });
      }
      // Only the visible part of a card is tappable.
      const hy0 = Math.max(y, SHOP_VIEW.top), hy1 = Math.min(y + h, SHOP_VIEW.bottom);
      hit(`card-${item.id}`, x, hy0, w, hy1 - hy0, () => buyOrEquip(item));
    });
    ctx.restore();
    if (max > 0) {
      const view = SHOP_VIEW.bottom - SHOP_VIEW.top;
      const thumbH = view * view / (view + max);
      const thumbY = SHOP_VIEW.top + (shopScroll / max) * (view - thumbH);
      rr(W - 34, thumbY, 8, thumbH, 4);
      ctx.fillStyle = hexA(th.muted, 0.45);
      ctx.fill();
    }
  }

  function drawSettings(th) {
    background(th);
    header(th, 'Settings', 'Make the game yours', false);
    const s = data.settings;
    const RH = 156;
    const section = (label, y) => text(label, 84, y + 26, 24, th.accent, { align: 'left', spacing: 6, weight: 700 });
    const row = (y, title, sub) => {
      card(80, y, 920, 140, 36, th.card, th.line);
      text(title, 124, y + 56, 40, th.ink, { align: 'left', weight: 700 });
      text(sub, 124, y + 98, 27, th.muted, { align: 'left', weight: 500 });
    };
    const toggle = (key, x, cy, on, onClick) => {
      const w = 120, h = 66, y = cy - h / 2;
      rr(x, y, w, h, h / 2);
      ctx.fillStyle = on ? hgrad(x, x + w, th.accent, th.accent2) : 'rgba(255,255,255,0.14)';
      ctx.fill();
      ctx.beginPath(); ctx.arc(on ? x + w - h / 2 : x + h / 2, cy, 26, 0, Math.PI * 2);
      ctx.fillStyle = on ? onAccent(th) : '#FFFFFF'; ctx.fill();
      hit(key, x, y, w, h, onClick);
    };

    let y = 262;
    section('AUDIO', y); y += 60;
    row(y, 'Sound effects', 'Taps, pours and the win fanfare');
    toggle('set-sfx', 840, y + 70, s.sfx, () => applySetting('sfx', !s.sfx));
    y += RH;
    row(y, 'Volume', 'Loudness of the sound effects');
    ['Low', 'Mid', 'High'].forEach((label, i) => {
      pill(`vol-${i}`, label, 572 + i * 132, y + 34, 124, 72, { size: 30, grad: i === s.volume, fill: th.panel, stroke: th.line,
        on: () => applySetting('volume', i) });
    });
    y += RH + 30;

    section('GAMEPLAY', y); y += 60;
    row(y, 'Haptic feedback', 'Short vibrations on pours and errors');
    toggle('set-haptics', 840, y + 70, s.haptics, () => applySetting('haptics', !s.haptics));
    y += RH;
    row(y, 'Smooth pour animation', 'Animate units flowing between tubes');
    toggle('set-anim', 840, y + 70, s.animations, () => applySetting('animations', !s.animations));
    y += RH;
    row(y, 'Color symbols', 'Shapes on each unit for easier color matching');
    toggle('set-symbols', 840, y + 70, s.symbols, () => applySetting('symbols', !s.symbols));
    y += RH + 30;

    section('APPEARANCE', y); y += 60;
    row(y, 'Theme', 'Cycle through the themes you own');
    pill('theme-prev', '', 548, y + 35, 70, 70, { r: 35, icon: iconChevron(-1), iconSize: 30, on: () => cycleTheme(-1) });
    text(th.name, 755, y + 70, 34, th.ink, { weight: 700 });
    pill('theme-next', '', 890, y + 35, 70, 70, { r: 35, icon: iconChevron(1), iconSize: 30, on: () => cycleTheme(1) });
    y += RH + 30;

    section('DATA', y); y += 60;
    row(y, 'Reset progress', 'Clears level, coins and owned themes');
    const armed = resetArmed();
    pill('reset', armed ? 'Tap again to confirm' : 'Reset', 600, y + 28, 340, 84, {
      size: 30, fill: armed ? '#FF5C6C' : 'rgba(255,92,108,0.14)', stroke: 'rgba(255,92,108,0.5)',
      color: armed ? '#FFFFFF' : '#FF7A86',
      on: () => {
        if (resetArmed()) resetProgress();
        else { resetArmedAt = performance.now(); SFX.click(); }
      },
    });
  }

  // ---------- Effects ----------
  function burst(th) {
    confetti = [];
    for (let i = 0; i < 140; i++) {
      confetti.push({
        x: W / 2 + (Math.random() - 0.5) * 260, y: 560,
        vx: (Math.random() - 0.5) * 1000, vy: -(Math.random() * 1100 + 300),
        r: Math.random() * 6, vr: (Math.random() - 0.5) * 14, life: 0,
        s: 12 + Math.random() * 12, c: th.colors[(Math.random() * th.colors.length) | 0],
      });
    }
  }
  function updateConfetti(dt) {
    for (const p of confetti) {
      p.life += dt; p.vy += 2200 * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt;
    }
    confetti = confetti.filter(p => p.life < 3.2 && p.y < H + 60);
  }
  function drawConfetti() {
    for (const p of confetti) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, 1 - p.life / 3.2);
      ctx.translate(p.x, p.y); ctx.rotate(p.r);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2);
      ctx.restore();
    }
  }
  function drawToast(th) {
    if (!toast) return;
    const a = toast.t < 2.2 ? 1 : Math.max(0, 1 - (toast.t - 2.2) / 0.5);
    const w = measure(toast.msg, 32, 600) + 80;
    ctx.save();
    ctx.globalAlpha = a;
    card(W / 2 - w / 2, 1826, w, 76, 38, th.card, th.line);
    text(toast.msg, W / 2, 1864, 32, th.ink, { weight: 600 });
    ctx.restore();
  }

  // ---------- Input ----------
  function toLogical(e) {
    const r = canvas.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  function hitAt(p) {
    for (let k = ui.length - 1; k >= 0; k--) {
      const b = ui[k];
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) return b;
    }
    return null;
  }
  let drag = null;
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault();
    audio(); // unlocks WebAudio on the first user gesture
    const p = toLogical(e);
    const b = hitAt(p);
    if (screen === 'shop') {
      // Shop taps fire on release, so a drag can scroll the list instead.
      drag = { startY: p.y, lastY: p.y, moved: false, hit: b };
      if (b) pressKey = b.key;
      canvas.setPointerCapture(e.pointerId);
      return;
    }
    if (b) {
      pressKey = b.key;
      setTimeout(() => { if (pressKey === b.key) pressKey = null; }, 160);
      b.on();
      return;
    }
    if (screen === 'game' && !game.won && !game.anim && game.tubes.length) {
      const lay = layoutFor(game.tubes.length);
      for (let i = 0; i < game.tubes.length; i++) {
        const r = lay.rects[i];
        if (p.x >= r.x - 12 && p.x <= r.x + r.w + 12 && p.y >= r.y - lay.lift - 20 && p.y <= r.y + r.h + 12) { tapTube(i); return; }
      }
    }
  });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    const p = toLogical(e);
    if (Math.abs(p.y - drag.startY) > 12) { drag.moved = true; pressKey = null; }
    if (drag.moved) shopScroll = Math.max(0, Math.min(shopMaxScroll(), shopScroll - (p.y - drag.lastY)));
    drag.lastY = p.y;
  });
  const endDrag = () => {
    if (!drag) return;
    const d = drag;
    drag = null;
    pressKey = null;
    if (!d.moved && d.hit) d.hit.on();
  };
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', e => {
    if (screen !== 'shop') return;
    e.preventDefault();
    shopScroll = Math.max(0, Math.min(shopMaxScroll(), shopScroll + e.deltaY * H / canvas.getBoundingClientRect().height));
  }, { passive: false });
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && screen !== 'menu') goBack();
  });

  // ---------- Main loop ----------
  function update(dt) {
    if (game.anim) {
      game.anim.t += dt;
      if (game.anim.t >= game.anim.dur) {
        game.anim = null;
        if (game.won) burst(T());
      }
    }
    if (screen === 'game') {
      for (let i = 0; i < game.tubes.length; i++) {
        const target = game.sel === i ? layoutFor(game.tubes.length).lift : 0;
        game.lift[i] += (target - game.lift[i]) * Math.min(1, dt * 14);
      }
    }
    if (toast) { toast.t += dt; if (toast.t > 2.7) toast = null; }
    updateConfetti(dt);
    fade = Math.max(0, fade - dt * 3.2);
  }
  let last = 0, time = 0;
  function frame(ts) {
    const dt = Math.min(0.05, last ? (ts - last) / 1000 : 0.016);
    last = ts; time += dt;
    update(dt);
    ui = [];
    const th = T();
    if (screen === 'menu') drawMenu(th, time);
    else if (screen === 'shop') drawShop(th);
    else if (screen === 'settings') drawSettings(th);
    else drawGame(th);
    drawToast(th);
    if (fade > 0) {
      ctx.save();
      ctx.globalAlpha = fade;
      ctx.fillStyle = th.bg[1];
      ctx.fillRect(0, 0, W, H);
      ctx.restore();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
